<div class="course-list-page container">
  <h1 class="page-title">All Courses</h1>

  <!-- Filters -->
  <div class="filters card">
    <div class="filter-row">
      <input class="form-control" type="text" [(ngModel)]="searchQuery"
             placeholder="Search courses..." />

      <select class="form-control" [(ngModel)]="selectedCategory">
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>

      <select class="form-control" [(ngModel)]="sortBy">
        <option value="title">Sort: Title</option>
        <option value="rating">Sort: Rating</option>
        <option value="credits">Sort: Credits</option>
      </select>
    </div>
  </div>

  <!-- Loading state -->
  <div class="alert alert-info" *ngIf="loading$ | async">Loading courses...</div>

  <!-- Course grid using NgRx store observable -->
  <ng-container *ngIf="courses$ | async as allCourses">
    <div class="grid-3">
      <div class="course-card card"
           *ngFor="let course of filterAndSort(allCourses); trackBy: trackById"
           appHighlight [highlightColor]="'#ebf8ff'">

        <div class="card-top">
          <span class="badge badge-blue">{{ course.category }}</span>
          <span class="badge" [ngClass]="course.enrolled ? 'badge-green' : 'badge-yellow'">
            {{ course.enrolled ? '✓ Enrolled' : 'Available' }}
          </span>
        </div>

        <h3>{{ course.title }}</h3>
        <p class="instructor">{{ course.instructor }}</p>
        <p class="desc">{{ course.description }}</p>

        <div class="meta">
          <span>{{ course.credits | creditLabel }}</span>
          <span>⭐ {{ course.rating }}</span>
          <span>⏱ {{ course.duration }}</span>
        </div>

        <div class="actions">
          <button class="btn" [ngClass]="course.enrolled ? 'btn-danger' : 'btn-success'"
                  (click)="onEnroll(course, $event)">
            {{ course.enrolled ? 'Unenroll' : 'Enroll' }}
          </button>
          <a [routerLink]="['/courses', course.id]" class="btn btn-primary">View</a>
          <button class="btn btn-danger" (click)="onDelete(course.id, $event)">🗑</button>
        </div>
      </div>
    </div>

    <div class="alert alert-info" *ngIf="filterAndSort(allCourses).length === 0">
      No courses match your search.
    </div>
  </ng-container>
</div>
