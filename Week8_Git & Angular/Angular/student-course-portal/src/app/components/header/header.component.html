<!-- Global Loading Spinner -->
<div class="spinner-overlay" *ngIf="loading$ | async">
  <div class="spinner"></div>
</div>

<!-- Global Notification Toast -->
<div class="toast" *ngIf="notification$ | async as notification"
     [ngClass]="getNotificationClass(notification)">
  {{ notification.message }}
</div>

<!-- Navigation Header -->
<header class="header">
  <div class="header-inner container">
    <!-- Brand -->
    <a routerLink="/" class="brand">
      <span class="brand-icon">🎓</span>
      <span class="brand-text">Student Course Portal</span>
    </a>

    <!-- Hamburger for mobile -->
    <button class="hamburger" (click)="toggleMenu()" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>

    <!-- Navigation Links -->
    <nav class="nav" [class.open]="menuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-link">Home</a>
      <a routerLink="/courses" routerLinkActive="active" class="nav-link">Courses</a>
      <a routerLink="/profile" routerLinkActive="active" class="nav-link">Profile</a>
      <a routerLink="/enrollment" routerLinkActive="active" class="nav-link">Enroll</a>

      <!-- Auth button -->
      <ng-container *ngIf="isLoggedIn$ | async; else loginBtn">
        <button class="btn btn-secondary btn-sm" (click)="logout()">Logout</button>
      </ng-container>
      <ng-template #loginBtn>
        <button class="btn btn-primary btn-sm" (click)="login()">Login</button>
      </ng-template>
    </nav>
  </div>
</header>
