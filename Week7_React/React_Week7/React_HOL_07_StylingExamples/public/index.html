<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Styling Examples</title>
    <!-- Internal CSS (inside HTML head) -->
    <style>
      .internal-css-box {
        background-color: #fff3e0;
        border: 2px solid #ff9800;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
        font-family: 'Segoe UI', sans-serif;
      }
      .internal-css-box h2 { color: #e65100; margin-bottom: 8px; }
      .internal-css-box p  { color: #555; }
    </style>
  </head>
  <body><div id="root"></div></body>
</html>
